<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Drone FPV</title>
  <link rel="stylesheet" href="./css/style.css" />

  <script>
    (function() {
      var lines = [];
      var visible = true;
      var el = null;
      var btn = null;

      function ensureEl() {
        if (el) return;
        if (!document.body) { setTimeout(ensureEl, 10); return; }
        el = document.createElement('div');
        el.id = '__dbg_overlay';
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);color:#0f0;font:11px/1.35 monospace;padding:8px;z-index:2147483647;white-space:pre-wrap;overflow:auto;pointer-events:auto;';
        el.addEventListener('click', function(e) {
          if (e.target === el) {
            visible = false; el.style.display = 'none';
            if (btn) btn.style.display = 'block';
          }
        });
        document.body.appendChild(el);

        btn = document.createElement('button');
        btn.textContent = 'DBG';
        btn.style.cssText = 'position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#0f0;color:#000;font:bold 14px monospace;border:2px solid #000;z-index:2147483647;cursor:pointer;display:none;';
        btn.addEventListener('click', function() {
          visible = true; el.style.display = 'block'; btn.style.display = 'none';
        });
        document.body.appendChild(btn);
        render();
      }

      function render() {
        if (!el) return;
        el.textContent = lines.join('\n');
      }

      function log(tag, msg) {
        var time = new Date().toISOString().slice(11, 23);
        var line = '[' + time + '] [' + tag + '] ' + msg;
        lines.push(line);
        if (lines.length > 500) lines.shift();
        if (visible && el) render();
        try { console.log(line); } catch (e) {}
      }

      window.__dbg = {
        log: log,
        clear: function() { lines = []; render(); },
        show: function() { visible = true; ensureEl(); el.style.display = 'block'; btn.style.display = 'none'; },
        hide: function() { visible = false; if (el) el.style.display = 'none'; if (btn) btn.style.display = 'block'; }
      };

      log('BOOT', 'start, url=' + location.href);

      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName) {
          var tag = e.target.tagName.toLowerCase();
          if (tag === 'script' || tag === 'link' || tag === 'img') {
            log('RES-FAIL', tag + ' src=' + (e.target.src || e.target.href));
            return;
          }
        }
        var stack = e.error && e.error.stack ? e.error.stack : '';
        log('ERROR', e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0));
        if (stack) log('STACK', stack);
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        var msg = r && r.message ? r.message : String(r);
        var stack = r && r.stack ? r.stack : '';
        log('PROMISE', msg);
        if (stack) log('STACK', stack);
      });

      var origErr = console.error;
      console.error = function() {
        var a = Array.prototype.slice.call(arguments);
        log('CONSOLE.ERR', a.map(function(x) {
          try { return typeof x === 'object' ? JSON.stringify(x) : String(x); } catch (e) { return String(x); }
        }).join(' '));
        origErr.apply(console, arguments);
      };

      var origWarn = console.warn;
      console.warn = function() {
        var a = Array.prototype.slice.call(arguments);
        log('CONSOLE.WARN', a.map(function(x) {
          try { return typeof x === 'object' ? JSON.stringify(x) : String(x); } catch (e) { return String(x); }
        }).join(' '));
        origWarn.apply(console, arguments);
      };

      var OrigWS = window.WebSocket;
      if (OrigWS) {
        window.WebSocket = function(url, protocols) {
          log('WS', '> ' + url);
          var ws = protocols ? new OrigWS(url, protocols) : new OrigWS(url);
          ws.addEventListener('open', function() { log('WS', '< OPEN'); });
          ws.addEventListener('close', function(e) { log('WS', '< CLOSE code=' + e.code + ' reason=' + (e.reason || '')); });
          ws.addEventListener('error', function() { log('WS', '< ERROR'); });
          return ws;
        };
        window.WebSocket.prototype = OrigWS.prototype;
        window.WebSocket.CONNECTING = OrigWS.CONNECTING;
        window.WebSocket.OPEN = OrigWS.OPEN;
        window.WebSocket.CLOSING = OrigWS.CLOSING;
        window.WebSocket.CLOSED = OrigWS.CLOSED;
      }

      document.addEventListener('DOMContentLoaded', function() {
        log('DOM', 'DOMContentLoaded');
        ensureEl();
      });
      window.addEventListener('load', function() { log('LOAD', 'window load'); });
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="loading" class="overlay">
    <h1>DRONE FPV</h1>
    <div class="loading-text">Загрузка <span id="loading-pct">0</span>%</div>
    <div class="loading-bar"><div id="loading-fill" class="loading-fill"></div></div>
    <div id="loading-status" class="status">инициализация</div>
  </div>

  <div id="menu" class="overlay hidden">
    <h1>DRONE FPV</h1>
    <div class="players-counter">
      Игроков онлайн: <span id="player-count">0</span> / <span id="player-max">10</span>
    </div>
    <input id="nickname" type="text" placeholder="Твой позывной" maxlength="16" autocomplete="off" />
    <button id="btn-play">ИГРАТЬ</button>
    <div id="menu-status" class="status"></div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-hp-bar">
      <div class="hp-fill" id="hud-hp-fill"></div>
      <div class="hp-text"><span id="hud-hp">100</span> HP</div>
    </div>
    <div id="drone-hud-parts" style="display:none;">
      <div class="hud-corner hud-tl">
        <div class="hud-metric"><span class="hud-label">ALT</span><span class="hud-value" id="hud-alt">0</span><span class="hud-unit">m</span></div>
        <div class="hud-metric"><span class="hud-label">VSI</span><span class="hud-value" id="hud-vsi">0</span><span class="hud-unit">m/s</span></div>
      </div>
      <div class="hud-corner hud-tr">
        <div class="hud-metric"><span class="hud-label">BAT</span><span class="hud-value" id="hud-bat">100</span><span class="hud-unit">%</span></div>
        <div class="hud-metric"><span class="hud-label">PING</span><span class="hud-value" id="hud-ping">-</span><span class="hud-unit">ms</span></div>
      </div>
      <div class="gauge" style="bottom: 140px; right: 20px;">
        <canvas id="tacho"></canvas>
        <div class="gauge-label">RPM</div>
        <div class="gauge-value"><span id="hud-rpm">0</span></div>
      </div>
      <div class="gauge" style="bottom: 20px; right: 20px;">
        <canvas id="speedo"></canvas>
        <div class="gauge-label">SPD</div>
        <div class="gauge-value"><span id="hud-speed">0</span><span class="gauge-unit">km/h</span></div>
      </div>
      <div class="hud-center">
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
      </div>
    </div>
    <div id="hud-hint" class="hud-hint"></div>
  </div>

  <div id="joy-move" class="joystick" style="display:none;">
    <div class="joystick-base"></div>
    <div class="joystick-knob"></div>
  </div>

  <div id="drone-cylinder" style="display:none;">
    <div class="cyl-track">
      <div class="cyl-ball"></div>
    </div>
    <div class="cyl-label-top">UP</div>
    <div class="cyl-label-bottom">DOWN</div>
  </div>

  <button id="btn-drone-exit" class="action-btn" style="display:none;">ВЫЙТИ</button>
  <button id="btn-drone-enter" class="action-btn" style="display:none;">ВЗЛЁТ</button>

  <div id="side-buttons" style="display:none;">
    <button id="btn-drones" class="side-btn">DRONES</button>
    <button id="btn-cars" class="side-btn disabled" disabled>CARS</button>
    <button id="btn-pos" class="side-btn side-btn-pos">POS</button>
  </div>

  <div id="drone-select" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">Выбор дрона</div>
      <div id="drone-grid" class="drone-grid"></div>
    </div>
  </div>

  <div id="death-screen" class="overlay hidden">
    <h1>ТЫ УМЕР</h1>
    <div class="death-info">Сбит взрывом дрона</div>
    <button id="btn-respawn">РЕСПАВН</button>
  </div>

  <div id="error-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.9);color:#e86c6c;font-family:monospace;font-size:12px;padding:20px;z-index:9999;overflow:auto;display:none;">
    <div id="error-text"></div>
  </div>

  <script type="module">
    (async function() {
      function log(tag, msg) { if (window.__dbg) window.__dbg.log(tag, msg); }

      log('TEST', '=== STEP 1: BASE IMPORTS ===');

      let fails = 0;
      async function T(name, fn) {
        try {
          const r = await fn();
          log('OK', name + ' → ' + (r || 'ok'));
        } catch (e) {
          fails++;
          log('FAIL', name + ' → ' + (e.message || e));
          if (e.stack) log('STACK', String(e.stack).split('\n').slice(0, 3).join(' | '));
        }
      }

      await T('three', async () => {
        const m = await import('three');
        return 'v' + m.REVISION;
      });

      await T('three-mesh-bvh', async () => {
        const m = await import('three-mesh-bvh');
        return Object.keys(m).length + ' exports';
      });

      await T('GLTFLoader', async () => {
        const m = await import('three/addons/loaders/GLTFLoader.js');
        return m.GLTFLoader ? 'ok' : 'no export';
      });

      log('TEST', '=== STEP 2: RAW FETCH main.js ===');

      let mainText = null;
      await T('fetch main.js as text', async () => {
        const r = await fetch('/client/js/main.js');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        mainText = await r.text();
        return mainText.length + ' bytes';
      });

      log('TEST', '=== STEP 3: PARSE main.js head ===');
      if (mainText) {
        const head = mainText.split('\n').slice(0, 30).join('\n');
        log('MAIN-HEAD', '\n' + head);
      }

      log('TEST', '=== STEP 4: EXTRACT IMPORTS FROM main.js ===');

      if (mainText) {
        const importRe = /import\s+(?:[\s\S]*?\s+from\s+)?['"]([^'"]+)['"]/g;
        const specs = [];
        let m;
        while ((m = importRe.exec(mainText)) !== null) {
          specs.push(m[1]);
        }
        log('IMPORTS', 'found ' + specs.length + ' imports');
        for (const s of specs) {
          log('IMPORT', s);
        }

        log('TEST', '=== STEP 5: TRY RESOLVE EACH IMPORT ===');

        for (const s of specs) {
          await T('import(' + s + ')', async () => {
            if (s.startsWith('http') || s.startsWith('/')) {
              await import(s);
            } else if (s.startsWith('.')) {
              const base = '/client/js/';
              const url = new URL(s, 'https://x' + base).pathname;
              await import(url);
            } else {
              await import(s);
            }
            return 'resolved';
          });
        }
      }

      log('TEST', '=== STEP 6: BLOB IMPORT main.js ===');

      if (mainText) {
        await T('blob import', async () => {
          const blob = new Blob([mainText], { type: 'application/javascript' });
          const url = URL.createObjectURL(blob);
          try {
            await import(url);
            return 'executed';
          } finally {
            URL.revokeObjectURL(url);
          }
        });
      }

      log('TEST', '=== STEP 7: TRY REAL main.js ===');

      await T('real main.js', async () => {
        await import('/client/js/main.js');
        return 'executed';
      });

      log('TEST', '=== DONE, fails=' + fails + ' ===');
    })();
  </script>
</body>
</html>
