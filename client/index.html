<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Drone FPV</title>
  <link rel="stylesheet" href="./css/style.css" />

  <script>
    (function() {
      var lines = [];
      var visible = true;
      var el = null;
      var btn = null;

      function ensureEl() {
        if (el) return;
        if (!document.body) {
          setTimeout(ensureEl, 10);
          return;
        }
        el = document.createElement('div');
        el.id = '__dbg_overlay';
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);color:#0f0;font:11px/1.35 monospace;padding:8px;z-index:2147483647;white-space:pre-wrap;overflow:auto;pointer-events:auto;';
        el.addEventListener('click', function(e) {
          if (e.target === el) {
            visible = false;
            el.style.display = 'none';
            if (btn) btn.style.display = 'block';
          }
        });
        document.body.appendChild(el);

        btn = document.createElement('button');
        btn.textContent = 'DBG';
        btn.style.cssText = 'position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#0f0;color:#000;font:bold 14px monospace;border:2px solid #000;z-index:2147483647;cursor:pointer;display:none;';
        btn.addEventListener('click', function() {
          visible = true;
          el.style.display = 'block';
          btn.style.display = 'none';
        });
        document.body.appendChild(btn);

        render();
      }

      function render() {
        if (!el) return;
        var txt = lines.join('\n');
        el.textContent = txt;
      }

      function log(tag, msg) {
        var time = new Date().toISOString().slice(11, 23);
        var line = '[' + time + '] [' + tag + '] ' + msg;
        lines.push(line);
        if (lines.length > 200) lines.shift();
        if (visible && el) render();
        console.log(line);
      }

      window.__dbg = {
        log: log,
        clear: function() { lines = []; render(); },
        show: function() { visible = true; ensureEl(); el.style.display = 'block'; btn.style.display = 'none'; },
        hide: function() { visible = false; if (el) el.style.display = 'none'; if (btn) btn.style.display = 'block'; }
      };

      log('BOOT', 'HTML script start');
      log('BOOT', 'userAgent: ' + navigator.userAgent);
      log('BOOT', 'url: ' + location.href);
      log('BOOT', 'online: ' + navigator.onLine);

      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName) {
          var tag = e.target.tagName.toLowerCase();
          if (tag === 'script' || tag === 'link' || tag === 'img') {
            log('RES-FAIL', tag + ' src=' + (e.target.src || e.target.href));
            return;
          }
        }
        var stack = e.error && e.error.stack ? e.error.stack : '';
        log('ERROR', e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0));
        if (stack) log('STACK', stack);
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        var msg = r && r.message ? r.message : String(r);
        var stack = r && r.stack ? r.stack : '';
        log('PROMISE', msg);
        if (stack) log('STACK', stack);
      });

      var origErr = console.error;
      console.error = function() {
        var a = Array.prototype.slice.call(arguments);
        log('CONSOLE.ERR', a.map(function(x) { return (typeof x === 'object' ? JSON.stringify(x) : String(x)); }).join(' '));
        origErr.apply(console, arguments);
      };

      var origWarn = console.warn;
      console.warn = function() {
        var a = Array.prototype.slice.call(arguments);
        log('CONSOLE.WARN', a.map(function(x) { return (typeof x === 'object' ? JSON.stringify(x) : String(x)); }).join(' '));
        origWarn.apply(console, arguments);
      };

      window.addEventListener('online', function() { log('NET', 'online'); });
      window.addEventListener('offline', function() { log('NET', 'offline'); });

      var origFetch = window.fetch;
      if (origFetch) {
        window.fetch = function() {
          var url = arguments[0];
          log('FETCH', '> ' + url);
          return origFetch.apply(this, arguments).then(function(r) {
            log('FETCH', '< ' + r.status + ' ' + url);
            return r;
          }).catch(function(err) {
            log('FETCH', '! ' + url + ' — ' + err.message);
            throw err;
          });
        };
      }

      var OrigXHR = window.XMLHttpRequest;
      if (OrigXHR) {
        window.XMLHttpRequest = function() {
          var x = new OrigXHR();
          var origOpen = x.open;
          var url = '';
          x.open = function(method, u) {
            url = u;
            log('XHR', '> ' + method + ' ' + u);
            return origOpen.apply(x, arguments);
          };
          x.addEventListener('load', function() {
            log('XHR', '< ' + x.status + ' ' + url);
          });
          x.addEventListener('error', function() {
            log('XHR', '! ' + url + ' — error');
          });
          return x;
        };
      }

      var OrigWS = window.WebSocket;
      if (OrigWS) {
        window.WebSocket = function(url, protocols) {
          log('WS', '> ' + url);
          var ws = protocols ? new OrigWS(url, protocols) : new OrigWS(url);
          ws.addEventListener('open', function() { log('WS', '< OPEN ' + url); });
          ws.addEventListener('close', function(e) { log('WS', '< CLOSE ' + url + ' code=' + e.code + ' reason=' + (e.reason || '')); });
          ws.addEventListener('error', function() { log('WS', '< ERROR ' + url); });
          return ws;
        };
        window.WebSocket.prototype = OrigWS.prototype;
        window.WebSocket.CONNECTING = OrigWS.CONNECTING;
        window.WebSocket.OPEN = OrigWS.OPEN;
        window.WebSocket.CLOSING = OrigWS.CLOSING;
        window.WebSocket.CLOSED = OrigWS.CLOSED;
      }

      var _setInterval = window.setInterval;
      window.setInterval = function() {
        try { return _setInterval.apply(window, arguments); }
        catch (e) { log('SETINTERVAL', e.message); throw e; }
      };

      var _setTimeout = window.setTimeout;
      window.setTimeout = function() {
        try { return _setTimeout.apply(window, arguments); }
        catch (e) { log('SETTIMEOUT', e.message); throw e; }
      };

      document.addEventListener('DOMContentLoaded', function() {
        log('DOM', 'DOMContentLoaded');
        ensureEl();
      });

      window.addEventListener('load', function() {
        log('LOAD', 'window load');
      });
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="loading" class="overlay">
    <h1>DRONE FPV</h1>
    <div class="loading-text">Загрузка <span id="loading-pct">0</span>%</div>
    <div class="loading-bar"><div id="loading-fill" class="loading-fill"></div></div>
    <div id="loading-status" class="status">инициализация</div>
  </div>

  <div id="menu" class="overlay hidden">
    <h1>DRONE FPV</h1>
    <div class="players-counter">
      Игроков онлайн: <span id="player-count">0</span> / <span id="player-max">10</span>
    </div>
    <input id="nickname" type="text" placeholder="Твой позывной" maxlength="16" autocomplete="off" />
    <button id="btn-play">ИГРАТЬ</button>
    <div id="menu-status" class="status"></div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-hp-bar">
      <div class="hp-fill" id="hud-hp-fill"></div>
      <div class="hp-text"><span id="hud-hp">100</span> HP</div>
    </div>

    <div id="drone-hud-parts" style="display:none;">
      <div class="hud-corner hud-tl">
        <div class="hud-metric"><span class="hud-label">ALT</span><span class="hud-value" id="hud-alt">0</span><span class="hud-unit">m</span></div>
        <div class="hud-metric"><span class="hud-label">VSI</span><span class="hud-value" id="hud-vsi">0</span><span class="hud-unit">m/s</span></div>
      </div>
      <div class="hud-corner hud-tr">
        <div class="hud-metric"><span class="hud-label">BAT</span><span class="hud-value" id="hud-bat">100</span><span class="hud-unit">%</span></div>
        <div class="hud-metric"><span class="hud-label">PING</span><span class="hud-value" id="hud-ping">-</span><span class="hud-unit">ms</span></div>
      </div>

      <div class="gauge" style="bottom: 140px; right: 20px;">
        <canvas id="tacho"></canvas>
        <div class="gauge-label">RPM</div>
        <div class="gauge-value"><span id="hud-rpm">0</span></div>
      </div>

      <div class="gauge" style="bottom: 20px; right: 20px;">
        <canvas id="speedo"></canvas>
        <div class="gauge-label">SPD</div>
        <div class="gauge-value"><span id="hud-speed">0</span><span class="gauge-unit">km/h</span></div>
      </div>

      <div class="hud-center">
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
      </div>
    </div>
    <div id="hud-hint" class="hud-hint"></div>
  </div>

  <div id="joy-move" class="joystick" style="display:none;">
    <div class="joystick-base"></div>
    <div class="joystick-knob"></div>
  </div>

  <div id="drone-cylinder" style="display:none;">
    <div class="cyl-track">
      <div class="cyl-ball"></div>
    </div>
    <div class="cyl-label-top">UP</div>
    <div class="cyl-label-bottom">DOWN</div>
  </div>

  <button id="btn-drone-exit" class="action-btn" style="display:none;">ВЫЙТИ</button>
  <button id="btn-drone-enter" class="action-btn" style="display:none;">ВЗЛЁТ</button>

  <div id="side-buttons" style="display:none;">
    <button id="btn-drones" class="side-btn">DRONES</button>
    <button id="btn-cars" class="side-btn disabled" disabled>CARS</button>
    <button id="btn-pos" class="side-btn side-btn-pos">POS</button>
  </div>

  <div id="drone-select" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">Выбор дрона</div>
      <div id="drone-grid" class="drone-grid"></div>
    </div>
  </div>

  <div id="death-screen" class="overlay hidden">
    <h1>ТЫ УМЕР</h1>
    <div class="death-info">Сбит взрывом дрона</div>
    <button id="btn-respawn">РЕСПАВН</button>
  </div>

  <div id="error-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.9);color:#e86c6c;font-family:monospace;font-size:12px;padding:20px;z-index:9999;overflow:auto;display:none;">
    <div id="error-text"></div>
  </div>

  <script>
    (function() {
      if (window.__dbg) window.__dbg.log('MODULE', 'before main.js script tag');
    })();
  </script>
  <script type="module" src="./js/main.js"></script>
  <script>
    (function() {
      if (window.__dbg) window.__dbg.log('MODULE', 'after main.js script tag');
    })();
  </script>
</body>
</html>
