<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, orientation=landscape" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>DRONE FPV</title>
  <link rel="stylesheet" href="./css/style.css" />

  <script>
    (function() {
      var lines = [];
      var visible = true;
      var el = null;
      var btn = null;
      var startTime = performance.now();

      function ensureEl() {
        if (el) return;
        if (!document.body) { setTimeout(ensureEl, 10); return; }
        el = document.createElement('div');
        el.id = '__dbg';
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.96);color:#0f0;font-family:ui-monospace,monospace;font-size:11px;line-height:1.4;padding:8px;z-index:2147483647;white-space:pre-wrap;overflow:auto;pointer-events:auto;letter-spacing:0.2px;';
        el.addEventListener('click', function(e) {
          if (e.target === el) {
            visible = false;
            el.style.display = 'none';
            if (btn) btn.style.display = 'block';
          }
        });
        document.body.appendChild(el);

        btn = document.createElement('button');
        btn.textContent = 'DBG';
        btn.style.cssText = 'position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#0f0;color:#000;font:bold 12px ui-monospace,monospace;border:2px solid #000;z-index:2147483647;cursor:pointer;display:none;';
        btn.addEventListener('click', function() {
          visible = true;
          el.style.display = 'block';
          btn.style.display = 'none';
        });
        document.body.appendChild(btn);
        render();
      }

      function render() {
        if (!el) return;
        el.textContent = lines.join('\n');
        el.scrollTop = el.scrollHeight;
      }

      function log(tag, msg) {
        var t = (performance.now() - startTime).toFixed(0).padStart(6, ' ');
        var line = '[' + t + 'ms] [' + tag + '] ' + (msg === undefined ? '' : msg);
        lines.push(line);
        if (lines.length > 600) lines.shift();
        if (visible && el) render();
        try { console.log(line); } catch (e) {}
      }

      window.__dbg = {
        log: log,
        clear: function() { lines = []; render(); },
        show: function() { visible = true; ensureEl(); if (el) el.style.display = 'block'; if (btn) btn.style.display = 'none'; },
        hide: function() { visible = false; if (el) el.style.display = 'none'; if (btn) btn.style.display = 'block'; }
      };

      log('BOOT', '=== START ===');
      log('BOOT', 'url=' + location.href);
      log('BOOT', 'origin=' + location.origin);
      log('BOOT', 'path=' + location.pathname);
      log('BOOT', 'online=' + navigator.onLine);
      log('BOOT', 'ua=' + navigator.userAgent.slice(0, 90));

      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName) {
          var tag = e.target.tagName.toLowerCase();
          if (tag === 'script' || tag === 'link' || tag === 'img') {
            log('RES-FAIL', tag + ' ' + (e.target.src || e.target.href));
            return;
          }
        }
        var stack = e.error && e.error.stack ? e.error.stack : '';
        log('ERROR', (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0));
        if (stack) log('STACK', stack);
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        var msg = r && r.message ? r.message : String(r);
        var stack = r && r.stack ? r.stack : '';
        log('PROMISE', msg);
        if (stack) log('STACK', stack);
      });

      var origErr = console.error;
      console.error = function() {
        var a = Array.prototype.slice.call(arguments);
        log('CONSOLE.ERR', a.map(function(x) {
          try { return typeof x === 'object' ? JSON.stringify(x).slice(0, 300) : String(x).slice(0, 300); } catch (e) { return String(x); }
        }).join(' '));
        origErr.apply(console, arguments);
      };

      var origWarn = console.warn;
      console.warn = function() {
        var a = Array.prototype.slice.call(arguments);
        log('CONSOLE.WARN', a.map(function(x) {
          try { return typeof x === 'object' ? JSON.stringify(x).slice(0, 300) : String(x).slice(0, 300); } catch (e) { return String(x); }
        }).join(' '));
        origWarn.apply(console, arguments);
      };

      document.addEventListener('DOMContentLoaded', function() {
        log('DOM', 'DOMContentLoaded');
        ensureEl();
        runSelfTest();
      });

      window.addEventListener('load', function() {
        log('LOAD', 'window load, ttfb=' + (performance.now() - startTime).toFixed(0) + 'ms');
      });

      async function runSelfTest() {
        log('TEST', '=== SELF TEST START ===');

        var ids = [
          'game-canvas', 'loading', 'loading-pct', 'loading-fill', 'loading-status',
          'menu', 'player-count', 'player-max', 'nickname', 'btn-play', 'menu-status',
          'hud', 'hud-hp-fill', 'hud-hp', 'hud-speed', 'hud-alt', 'hud-vsi',
          'hud-bat', 'hud-ping', 'hud-rpm', 'hud-hint', 'speedo', 'tacho',
          'joy-move', 'drone-cylinder', 'btn-drone-enter', 'btn-drone-exit',
          'side-buttons', 'btn-drones', 'btn-cars', 'btn-pos',
          'drone-select', 'drone-grid', 'team-select', 'team-red', 'team-blue',
          'team-red-count', 'team-blue-count', 'team-status',
          'death-screen', 'btn-respawn'
        ];
        var missing = [];
        for (var i = 0; i < ids.length; i++) {
          if (!document.getElementById(ids[i])) missing.push(ids[i]);
        }
        if (missing.length === 0) log('TEST-DOM', 'all ' + ids.length + ' ids present');
        else log('TEST-DOM', 'MISSING: ' + missing.join(', '));

        try {
          var three = await import('three');
          log('IMP', 'three OK, r' + three.REVISION);
        } catch (e) { log('IMP-FAIL', 'three: ' + e.message); }

        try {
          var bvh = await import('three-mesh-bvh');
          log('IMP', 'three-mesh-bvh OK, ' + Object.keys(bvh).length + ' exports');
        } catch (e) { log('IMP-FAIL', 'three-mesh-bvh: ' + e.message); }

        try {
          var gl = await import('three/addons/loaders/GLTFLoader.js');
          log('IMP', 'GLTFLoader OK, class: ' + !!gl.GLTFLoader);
        } catch (e) { log('IMP-FAIL', 'GLTFLoader: ' + e.message); }

        try {
          var draco = await import('three/addons/loaders/DRACOLoader.js');
          log('IMP', 'DRACOLoader OK, class: ' + !!draco.DRACOLoader);
        } catch (e) { log('IMP-FAIL', 'DRACOLoader: ' + e.message); }

        try {
          var c1 = await import('/shared/config/config.js');
          log('IMP', '/shared/config/config.js OK, CFG: ' + Object.keys(c1.CFG || {}).length);
        } catch (e) { log('IMP-FAIL', '/shared/config/config.js: ' + e.message); }

        try {
          var c2 = await import('../../shared/config/config.js');
          log('IMP', '../../shared/config/config.js OK, CFG: ' + Object.keys(c2.CFG || {}).length);
        } catch (e) { log('IMP-FAIL', '../../shared/config/config.js: ' + e.message); }

        log('TEST', '=== MAIN.JS DEPS ===');
        var mods = [
          './js/core/scene.js',
          './js/core/loop.js',
          './js/core/cameraManager.js',
          './js/core/assetsLoader.js',
          './js/core/audioManager.js',
          './js/core/errorOverlay.js',
          './js/core/sensitivity.js',
          './js/core/gameState.js',
          './js/core/systems.js',
          './js/core/debugHud.js',
          './js/entities/LocalPlayer.js',
          './js/entities/LocalDrone.js',
          './js/entities/RemotePlayer.js',
          './js/entities/RemoteDrone.js',
          './js/render/hud.js',
          './js/render/propellerAnimator.js',
          './js/ui/menu.js',
          './js/ui/deathScreen.js',
          './js/ui/droneSelectMenu.js',
          './js/ui/teamSelectMenu.js',
          './js/ui/networkOverlay.js',
          './js/ui/connectionBadge.js',
          './js/ui/disconnectHandler.js',
          './js/world/mapLoader.js',
          './js/world/collisionLoader.js',
          './js/world/collisionWorld.js',
          './js/fx/explosion.js',
          './js/net/socket.js',
          './js/net/stateManager.js',
          './js/net/interpolationBuffer.js',
          './js/input/touchJoystick.js',
          './js/input/touchCamera.js',
          './assets/sounds/panner.js',
          './assets/sounds/explosion.js',
          './assets/sounds/drone_local.js',
          './assets/sounds/drone_remote.js',
          './assets/sounds/battery_beep.js',
        ];
        for (var d = 0; d < mods.length; d++) {
          try {
            await import(mods[d]);
            log('DEP-OK', mods[d]);
          } catch (e) {
            log('DEP-FAIL', mods[d] + ' :: ' + e.message);
          }
        }

        log('TEST', '=== MODELS ===');
        var models = ['map.glb', 'collision.glb', 'dron1.glb', 'dron2.glb', 'bro.glb'];
        for (var m = 0; m < models.length; m++) {
          try {
            var t0 = performance.now();
            var r = await fetch('./assets/models/' + models[m], { method: 'HEAD' });
            var dtms = (performance.now() - t0).toFixed(0);
            log('MODEL', models[m] + ' ' + r.status + ' ' + (r.headers.get('content-length') || '?') + 'b ' + dtms + 'ms');
          } catch (e) {
            log('MODEL-FAIL', models[m] + ': ' + e.message);
          }
        }

        log('TEST', '=== TRY main.js ===');
        try {
          var t0 = performance.now();
          var main = await import('./js/main.js');
          var dtms = (performance.now() - t0).toFixed(0);
          log('MAIN', 'main.js imported OK in ' + dtms + 'ms');
        } catch (e) {
          log('MAIN-FAIL', e.message);
          if (e.stack) log('MAIN-STACK', String(e.stack).split('\n').slice(0, 6).join(' | '));
        }

        log('TEST', '=== SELF TEST END ===');
      }
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="loading" class="overlay loading-screen">
    <div class="loading-grid"></div>
    <div class="loading-box">
      <div class="loading-logo">DRONE FPV</div>
      <div class="loading-sub">TACTICAL MULTIPLAYER SIMULATOR</div>
      <div class="loading-bar-outer">
        <div id="loading-fill" class="loading-fill"></div>
      </div>
      <div class="loading-pct-line">
        <span id="loading-pct">0</span><span class="loading-pct-sym">%</span>
      </div>
      <div id="loading-status" class="loading-status">инициализация</div>
    </div>
  </div>

  <div id="menu" class="overlay hidden">
    <div class="menu-bg"></div>
    <div class="menu-box">
      <div class="menu-logo">DRONE FPV</div>
      <div class="menu-tag">TACTICAL MULTIPLAYER SIMULATOR</div>
      <div class="menu-counter">
        <span class="dot live"></span>
        ОНЛАЙН <span id="player-count">0</span> / <span id="player-max">10</span>
      </div>
      <input id="nickname" type="text" placeholder="Твой позывной" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button id="btn-play">НАЧАТЬ МИССИЮ</button>
      <div id="menu-status" class="status"></div>
    </div>
  </div>

  <div id="team-select" class="modal hidden">
    <div class="modal-box team-modal">
      <div class="modal-title">ВЫБЕРИ СТОРОНУ</div>
      <div class="team-grid">
        <button id="team-red" class="team-tile team-red">
          <div class="team-badge"></div>
          <div class="team-name">КРАСНЫЕ</div>
          <div class="team-count"><span id="team-red-count">0</span></div>
          <div class="team-label">ОПЕРАТОРОВ</div>
        </button>
        <button id="team-blue" class="team-tile team-blue">
          <div class="team-badge"></div>
          <div class="team-name">СИНИЕ</div>
          <div class="team-count"><span id="team-blue-count">0</span></div>
          <div class="team-label">ОПЕРАТОРОВ</div>
        </button>
      </div>
      <div id="team-status" class="status"></div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-vignette"></div>

    <div class="hud-hp">
      <div class="hud-hp-label">HP</div>
      <div class="hud-hp-bar"><div class="hp-fill" id="hud-hp-fill"></div></div>
      <div class="hud-hp-text"><span id="hud-hp">100</span></div>
    </div>

    <div id="drone-hud-parts" style="display:none;">
      <div class="hud-tl">
        <div class="hud-metric"><span class="hud-l">ALT</span><span class="hud-v" id="hud-alt">0</span><span class="hud-u">m</span></div>
        <div class="hud-metric"><span class="hud-l">VSI</span><span class="hud-v" id="hud-vsi">0</span><span class="hud-u">m/s</span></div>
      </div>

      <div class="hud-tr">
        <div class="hud-metric right"><span class="hud-l">BAT</span><span class="hud-v" id="hud-bat">100</span><span class="hud-u">%</span></div>
        <div class="hud-metric right"><span class="hud-l">PING</span><span class="hud-v" id="hud-ping">-</span><span class="hud-u">ms</span></div>
      </div>

      <div class="gauge tacho-gauge">
        <canvas id="tacho"></canvas>
        <div class="gauge-label">RPM</div>
        <div class="gauge-value"><span id="hud-rpm">0</span></div>
      </div>

      <div class="gauge speedo-gauge">
        <canvas id="speedo"></canvas>
        <div class="gauge-label">SPD</div>
        <div class="gauge-value"><span id="hud-speed">0</span><span class="gauge-unit">km/h</span></div>
      </div>

      <div class="hud-center">
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
        <div class="crosshair-dot"></div>
      </div>
    </div>

    <div id="hud-hint" class="hud-hint"></div>
  </div>

  <div id="joy-move" class="joystick" style="display:none;">
    <div class="joystick-base"></div>
    <div class="joystick-ring"></div>
    <div class="joystick-knob"></div>
    <div class="joystick-label joystick-label-top">▲</div>
    <div class="joystick-label joystick-label-bottom">▼</div>
    <div class="joystick-label joystick-label-left">◀</div>
    <div class="joystick-label joystick-label-right">▶</div>
  </div>

  <div id="drone-cylinder" style="display:none;">
    <div class="cyl-track">
      <div class="cyl-grid"></div>
      <div class="cyl-ball"></div>
    </div>
    <div class="cyl-label-top">▲ UP</div>
    <div class="cyl-label-bottom">DOWN ▼</div>
  </div>

  <button id="btn-drone-exit" class="action-btn small" style="display:none;">ВЫЙТИ</button>
  <button id="btn-drone-enter" class="action-btn big" style="display:none;">ВЗЛЁТ</button>

  <div id="side-buttons" style="display:none;">
    <button id="btn-drones" class="side-btn">ДРОНЫ</button>
    <button id="btn-cars" class="side-btn disabled" disabled>МАШИНЫ</button>
    <button id="btn-pos" class="side-btn side-btn-pos">POS</button>
  </div>

  <div id="drone-select" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">ВЫБОР ДРОНА</div>
      <div id="drone-grid" class="drone-grid"></div>
    </div>
  </div>

  <div id="death-screen" class="overlay hidden">
    <div class="death-box">
      <div class="death-logo">ТЫ УМЕР</div>
      <div class="death-info">СБИТ ВЗРЫВОМ ДРОНА</div>
      <button id="btn-respawn">РЕСПАВН</button>
    </div>
  </div>

  <script>
    (function() {
      if (window.__dbg) window.__dbg.log('MODULE', 'before main.js script tag');
    })();
  </script>
  <script type="module" src="./js/main.js"></script>
  <script>
    (function() {
      if (window.__dbg) window.__dbg.log('MODULE', 'after main.js script tag');
    })();
  </script>
</body>
</html>
