<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, orientation=landscape" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>DRONE FPV</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="loading" class="overlay loading-screen">
    <div class="loading-grid"></div>
    <div class="loading-box">
      <div class="loading-logo">DRONE FPV</div>
      <div class="loading-sub">TACTICAL MULTIPLAYER SIMULATOR</div>
      <div class="loading-bar-outer">
        <div id="loading-fill" class="loading-fill"></div>
      </div>
      <div class="loading-pct-line">
        <span id="loading-pct">0</span><span class="loading-pct-sym">%</span>
      </div>
      <div id="loading-status" class="loading-status">инициализация</div>
    </div>
  </div>

  <div id="menu" class="overlay hidden">
    <div class="menu-bg"></div>
    <div class="menu-box">
      <div class="menu-logo">DRONE FPV</div>
      <div class="menu-tag">TACTICAL MULTIPLAYER SIMULATOR</div>
      <div class="menu-counter">
        <span class="dot live"></span>
        ОНЛАЙН <span id="player-count">0</span> / <span id="player-max">10</span>
      </div>
      <input id="nickname" type="text" placeholder="Твой позывной" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button id="btn-play">НАЧАТЬ МИССИЮ</button>
      <div id="menu-status" class="status"></div>
    </div>
  </div>

  <div id="team-select" class="modal hidden">
    <div class="modal-box team-modal">
      <div class="modal-title">ВЫБЕРИ СТОРОНУ</div>
      <div class="team-grid">
        <button id="team-red" class="team-tile team-red">
          <div class="team-badge"></div>
          <div class="team-name">КРАСНЫЕ</div>
          <div class="team-count"><span id="team-red-count">0</span></div>
          <div class="team-label">ОПЕРАТОРОВ</div>
        </button>
        <button id="team-blue" class="team-tile team-blue">
          <div class="team-badge"></div>
          <div class="team-name">СИНИЕ</div>
          <div class="team-count"><span id="team-blue-count">0</span></div>
          <div class="team-label">ОПЕРАТОРОВ</div>
        </button>
      </div>
      <div id="team-status" class="status"></div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-vignette"></div>

    <div class="hud-hp">
      <div class="hud-hp-label">HP</div>
      <div class="hud-hp-bar"><div class="hp-fill" id="hud-hp-fill"></div></div>
      <div class="hud-hp-text"><span id="hud-hp">100</span></div>
    </div>

    <div id="drone-hud-parts" style="display:none;">
      <div class="hud-tl">
        <div class="hud-metric"><span class="hud-l">ALT</span><span class="hud-v" id="hud-alt">0</span><span class="hud-u">m</span></div>
        <div class="hud-metric"><span class="hud-l">VSI</span><span class="hud-v" id="hud-vsi">0</span><span class="hud-u">m/s</span></div>
      </div>

      <div class="hud-tr">
        <div class="hud-metric right"><span class="hud-l">BAT</span><span class="hud-v" id="hud-bat">100</span><span class="hud-u">%</span></div>
        <div class="hud-metric right"><span class="hud-l">PING</span><span class="hud-v" id="hud-ping">-</span><span class="hud-u">ms</span></div>
      </div>

      <div class="gauge tacho-gauge">
        <canvas id="tacho"></canvas>
        <div class="gauge-label">RPM</div>
        <div class="gauge-value"><span id="hud-rpm">0</span></div>
      </div>

      <div class="gauge speedo-gauge">
        <canvas id="speedo"></canvas>
        <div class="gauge-label">SPD</div>
        <div class="gauge-value"><span id="hud-speed">0</span><span class="gauge-unit">km/h</span></div>
      </div>

      <div class="hud-center">
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
        <div class="crosshair-dot"></div>
      </div>
    </div>

    <div id="hud-hint" class="hud-hint"></div>
  </div>

  <div id="joy-move" class="joystick" style="display:none;">
    <div class="joystick-base"></div>
    <div class="joystick-ring"></div>
    <div class="joystick-knob"></div>
    <div class="joystick-label joystick-label-top">▲</div>
    <div class="joystick-label joystick-label-bottom">▼</div>
    <div class="joystick-label joystick-label-left">◀</div>
    <div class="joystick-label joystick-label-right">▶</div>
  </div>

  <div id="drone-cylinder" style="display:none;">
    <div class="cyl-track">
      <div class="cyl-grid"></div>
      <div class="cyl-ball"></div>
    </div>
    <div class="cyl-label-top">▲ UP</div>
    <div class="cyl-label-bottom">DOWN ▼</div>
  </div>

  <button id="btn-drone-exit" class="action-btn small" style="display:none;">ВЫЙТИ</button>
  <button id="btn-drone-enter" class="action-btn big" style="display:none;">ВЗЛЁТ</button>

  <div id="side-buttons" style="display:none;">
    <button id="btn-drones" class="side-btn">ДРОНЫ</button>
    <button id="btn-cars" class="side-btn disabled" disabled>МАШИНЫ</button>
    <button id="btn-pos" class="side-btn side-btn-pos">POS</button>
  </div>

  <div id="drone-select" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">ВЫБОР ДРОНА</div>
      <div id="drone-grid" class="drone-grid"></div>
    </div>
  </div>

  <div id="death-screen" class="overlay hidden">
    <div class="death-box">
      <div class="death-logo">ТЫ УМЕР</div>
      <div class="death-info">СБИТ ВЗРЫВОМ ДРОНА</div>
      <button id="btn-respawn">РЕСПАВН</button>
    </div>
  </div>

  <div id="error-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.95);color:#e86c6c;font-family:ui-monospace,monospace;font-size:12px;padding:20px;z-index:9999;overflow:auto;display:none;">
    <div id="error-text"></div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
